# YoureCom Standard: managed by _dev/standard (apply.php), do not edit here.
name: Release

# Builds the package for a tag like v6.2.14 or v6.2.14-beta.2 and attaches it to a GitHub release.
# Nothing is deployed: uploading to yourecom.de stays a manual step that needs Marcel's approval
# (before that: bash ../_dev/release-check.sh <plugin>, it needs SSH access to the live server).
#
# Started by hand on a branch (gh workflow run release.yml -R YoureCom/<plugin> --ref 6.2) it is a rehearsal: all checks and the
# package build, no comparison with a tag and nothing published. So a broken release path shows before the next tag does.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # a called workflow gets no secrets by itself: without them the required packages are not cloned and the checks fail
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the version in package.xml
        id: version
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' package.xml | head -1)"
          # "6.2.14 Beta 2" and "v6.2.14-beta.2" both become "6.2.14.beta.2"
          normalize() { echo "$1" | tr '[:upper:]' '[:lower:]' | sed -e 's/^v//' -e 's/[ -]/./g'; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$(normalize "$version")" != "$(normalize "$GITHUB_REF_NAME")" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version '$version' in package.xml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if echo "$version" | grep -qiE 'alpha|beta|rc'; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      # the package build compiles the TypeScript once to prove the committed JavaScript is current (check-js-build.mjs),
      # which needs the compiler from node_modules
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('tsconfig.json') != '' }}
        with:
          node-version: 22

      # the WoltLab packages come from GitHub, the lock file names them by SSH
      - name: npm install
        if: ${{ hashFiles('tsconfig.json') != '' }}
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      # in its own assignment: inside `echo "archive=$(...)"` a failed build would go unnoticed, echo succeeds
      - name: Build the package
        id: build
        run: |
          archive="$(bash .github/scripts/build-package.sh "$RUNNER_TEMP/package")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.archive }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease }}
